# moge - VisionIST box manifest
# Validated against registry/schema.json by CI.
# Everything downstream (index, README table, build matrix,
# fleet generator) is generated from this file.
name: moge
key: moge
version: 0.1.0
summary: 'MoGe-3 monocular geometry: metric depth, point map, normals, intrinsics'
runtime: cuda-only
status: stable
tags:
- depth
- geometry
- monocular
image:
  repository: sipgisr/visionist-moge
  registries:
  - dockerhub
  platforms:
  - linux/amd64
maintainers:
- github: jpcosteira
  name: Joao Paulo Costeira
  email: jpc@isr.tecnico.ulisboa.pt
commands:
  values:
  - infer
  - reset
  default: infer
parameters:
- name: fov_x
  type: number
  description: Known horizontal FOV in degrees. This is what pins the metric scale down; without it MoGe
    estimates the FOV and an FOV error becomes a scale error.
- name: refine_steps
  type: integer
  default: 3
- name: resolution_level
  type: integer
  default: 9
  description: 0..9
- name: fp16
  type: boolean
  default: true
- name: device
  type: string
  description: '"cuda" or "cuda:N"'
data:
  in:
  - field: images
    kind: bb
    required: true
  out:
  - field: results
    codec: zstd_pickle
    shape: list, one dict per image
    description: points (H,W,3), depth (H,W), intrinsics (3,3), mask (H,W), normal (H,W,3); OpenCV camera
      coords
constraints:
- 'CUDA only: an explicit device "cpu" is rejected (the refinement uses CUDA-only Triton kernels).'
- Declares `encoding` as a bare string.
- Invalid pixels come back as inf/nan in depth - filter with the mask.
# Server limits. The fleet generator writes these into the compose file as
# environment variables; override any of them at launch - no rebuild.
limits:
  max_message_mb: 128
  max_workers: 4

links:
  upstream: https://github.com/microsoft/MoGe
