# mediapipe - VisionIST box manifest
# Validated against registry/schema.json by CI.
# Everything downstream (index, README table, build matrix,
# fleet generator) is generated from this file.
name: mediapipe
key: mediapipe
version: 0.1.1
summary: 'MediaPipe landmarks: 21-point hands, 33-point body pose, 478-point face mesh, on CPU'
runtime: cpu
status: experimental
tags:
- landmarks
- pose
- hands
- face
image:
  repository: sipgisr/visionist-mediapipe
  registries:
  - dockerhub
  platforms:
  - linux/amd64
  approx_size_gb: 0.7
maintainers:
- github: jpcosteira
  name: Joao Paulo Costeira
  email: jpc@isr.tecnico.ulisboa.pt
commands:
  values:
  - hands
  - pose
  - face
  - reset
  default: hands
parameters:
- name: max_results
  type: integer
  default: 2
  description: Hands / poses / faces to look for per image (num_hands, num_poses, num_faces upstream).
    Defaults to 2 for hands, 1 for pose and face.
- name: model
  type: string
  default: lite
  enum:
  - lite
  - full
  - heavy
  commands:
  - pose
  description: Pose bundle only. lite is ~3x faster than heavy, heavy is the most accurate.
- name: coordinates
  type: string
  default: normalized
  enum:
  - normalized
  - pixels
  description: MediaPipe returns x, y in [0, 1] and z on roughly the same scale as x. 'pixels'
    multiplies x and z by the image width and y by the image height, so landmarks line up with
    the keypoints the opencv and features boxes return.
- name: min_detection_confidence
  type: number
  default: 0.5
- name: min_presence_confidence
  type: number
  default: 0.5
- name: min_tracking_confidence
  type: number
  default: 0.5
  description: Only read in VIDEO running mode, which this box does not expose yet.
- name: blendshapes
  type: boolean
  default: false
  commands:
  - face
  description: Also return the 52 expression scores.
- name: transformation_matrix
  type: boolean
  default: false
  commands:
  - face
  description: Also return the 4x4 canonical-face-to-detected-face matrix.
data:
  in:
  - field: images
    kind: bb
    required: true
    description: JPEG/PNG bytes, one or more
  out:
  - field: landmarks
    codec: numpy
    shape: (n_images, M, L, 3)
    description: L is 21 (hands), 33 (pose) or 478 (face). M is the padded per-image detection
      count - read `counts` before trusting a row.
  - field: counts
    codec: numpy
    shape: (n_images,)
    description: int32, how many hands/poses/faces were actually found in each image. Rows of
      `landmarks` past counts[i] are zero padding.
  - field: world_landmarks
    codec: numpy
    shape: (n_images, M, L, 3)
    when: hands, pose
    description: Metric coordinates in metres, origin at the hand or hip centre. Not produced
      by the face bundle.
  - field: handedness
    codec: numpy
    shape: (n_images, M)
    when: hands
    description: int8, 0 = left, 1 = right, -1 = padding. MediaPipe labels a mirrored (selfie)
      image, so a webcam frame reports the opposite hand unless it was flipped first.
  - field: scores
    codec: numpy
    shape: (n_images, M)
    when: hands
    description: Confidence of the handedness label.
  - field: visibility
    codec: numpy
    shape: (n_images, M, 33)
    when: pose
    description: Per-landmark visibility in [0, 1]; an occluded joint is still given a position.
  - field: blendshapes
    codec: numpy
    shape: (n_images, M, 52)
    when: face, parameters.blendshapes
  - field: blendshape_names
    codec: json
    when: face, parameters.blendshapes
    description: The 52 category names, in the column order of `blendshapes`.
  - field: transformation_matrixes
    codec: numpy
    shape: (n_images, M, 4, 4)
    when: face, parameters.transformation_matrix
constraints:
- Landmarks are NORMALIZED to [0, 1] by default, as (x, y, z) with x across the width - not pixels,
  and not the (y, x) that tapnext reports. Send coordinates=pixels to get pixel units.
- '`landmarks` is padded to the largest detection count in the batch: always read `counts` first.
  An image with no detection contributes a zero row.'
- z is depth relative to the subject (wrist for hands, hips for pose, head centre for face), in
  the same scale as x. It is not metric - use world_landmarks for that.
- One model bundle per command is baked into the image at build time; the box never downloads
  at runtime and needs no network.
- CPU only. MediaPipe's GPU delegate targets Android, iOS and the web, not a Linux server.
assets:
- path: models/hand_landmarker.task
  url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
- path: models/pose_landmarker_lite.task
  url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
- path: models/pose_landmarker_full.task
  url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
- path: models/pose_landmarker_heavy.task
  url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task
- path: models/face_landmarker.task
  url: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
# Server limits. The fleet generator writes these into the compose file as
# environment variables; override any of them at launch - no rebuild.
limits:
  max_message_mb: 64
  max_workers: 4

links:
  upstream: https://ai.google.dev/edge/mediapipe/solutions/guide
  license: Apache-2.0
