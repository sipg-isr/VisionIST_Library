# yolo - VisionIST box manifest
# Validated against registry/schema.json by CI.
# Everything downstream (index, README table, build matrix,
# fleet generator) is generated from this file.
name: yolo
key: yolo
version: 0.1.0
summary: YOLO object detection with always-on tracking, on images or video
runtime: gpu-or-cpu
status: stable
tags:
- detection
- tracking
image:
  repository: sipgisr/visionist-yolo
  registries:
  - dockerhub
  platforms:
  - linux/amd64
maintainers:
- github: jpcosteira
  name: Joao Paulo Costeira
  email: jpc@isr.tecnico.ulisboa.pt
commands:
  values:
  - detect
  - pose
  - segment
  - obb
  - classify
  - reset
  - list
  default: detect
session:
  key: session_id
  location: section
  note: Track ids are stable within a session and restart at 1 for a fresh tracker, so they collide across
    sessions by design.
parameters:
- name: conf
  type: number
  default: 0.25
- name: iou
  type: number
  default: 0.7
- name: imgsz
  type: integer
  default: 640
- name: max_det
  type: integer
  default: 300
- name: classes
  type: array
  description: class ids to keep; null keeps all
- name: save_annotated
  type: boolean
  default: true
- name: frame_step
  type: integer
  default: 1
  commands:
  - detect
- name: max_frames
  type: integer
  default: 1024
  commands:
  - detect
- name: return_masks
  type: boolean
  default: false
  commands:
  - segment
  description: >-
    Also return full per-instance binary masks, rasterised from the polygons at frame resolution.
    Off by default because it is roughly 900x the payload of the polygons (1.5M values against
    1.6k points for five people) and the polygons already carry the shape.
- name: nms
  type: boolean
  description: >-
    false selects YOLO26's NMS-free one-to-one head (end-to-end inference). Omit to leave
    ultralytics on its default one-to-many head with NMS.
- name: weights
  type: string
  default: yolov8n.pt
- name: device
  type: string
data:
  in:
  - field: images
    kind: bb
  - field: video
    kind: b
    description: mp4/avi/webm/mov
  out:
  - field: detections
    codec: json
    shape: one record per frame
    description: >-
      Always frame_index, width, height, boxes [x1,y1,x2,y2], class_ids, labels, scores, track_id.
      Per task it also carries: keypoints (N,17,3) as [x,y,confidence] plus keypoint_names (pose);
      polygons, one contour per instance in frame pixels (segment); obb with xywhr and the four
      corners (obb); classification with top1/top5 and no per-object entries (classify).
      A task leaves the keys it has nothing to say about at null.
  - field: masks
    codec: numpy
    shape: one (num_instances, H, W) uint8 stack per frame
    when: command segment with parameters.return_masks
  - field: annotated
    codec: identity
    shape: list of JPEG bytes
    when: parameters.save_annotated
  - field: annotated_video
    codec: identity
    shape: one MP4
    when: video input
  - field: annotated_zip
    codec: identity
    shape: ZIP of frames + detections + manifest
constraints:
- The command IS the task, and a checkpoint knows its own task - `pose` needs a -pose checkpoint, `segment` a -seg one. A mismatch is refused with the name of the checkpoint to use rather than running and quietly returning none of the fields you asked for.
- Segmentation polygons come from masks.xy, which ultralytics has already scaled to the frame. The raw masks.data is at the MODEL input size (640x480 for an 810x1080 frame), so it does not line up with the boxes; return_masks rasterises the polygons instead.
- classify cannot be tracked - ultralytics refuses mode=track for it - so classify records carry no track_id. detect, pose, segment and obb all track.
- Default checkpoints per task are yolo26n-<task>.pt (override with YOLO_POSE_WEIGHTS / YOLO_SEG_WEIGHTS / YOLO_OBB_WEIGHTS / YOLO_CLS_WEIGHTS); detect keeps its historical YOLO_WEIGHTS default so existing callers are untouched.
- The bundled obb checkpoint is trained on DOTA aerial imagery and finds nothing in ordinary ground-level photos.
- '`images` and `video` are mutually exclusive; neither gives empty_request.'
- conf and iou are clamped to <= 1.0.
- Sessions expire (YOLO_SESSION_TTL, default 1800s).
# Server limits. The fleet generator writes these into the compose file as
# environment variables; override any of them at launch - no rebuild.
limits:
  max_message_mb: 256
  max_workers: 4
  note: Video in, and annotated frames back out when save_annotated is on.

links:
  upstream: https://github.com/ultralytics/ultralytics
